<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Календар за намаз</title>
        <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
        <script>
            (function () {
                var mode = localStorage.getItem('themeMode') || 'system';
                var prefersDark = window.matchMedia(
                    '(prefers-color-scheme: dark)'
                ).matches;
                var resolved =
                    mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
                document.documentElement.setAttribute('data-theme', resolved);

                var colorTheme = localStorage.getItem('colorTheme');
                if (colorTheme && colorTheme !== 'green') {
                    document.documentElement.setAttribute(
                        'data-color-theme',
                        colorTheme
                    );
                }
            })();
        </script>
        <link rel="stylesheet" href="./style.css" />
        <link rel="manifest" href="/manifest.json" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
    </head>

    <body>
        <div class="app-shell">
            <header class="header">
                <h1 class="app-title">Времето за намаз</h1>
            </header>
            <main id="content" class="fallback-content">
                <div class="day-card fallback-card">
                    <h2 class="date">Оппа!</h2>
                    <p>
                        За съжаление не можете да видите тази страницата,
                        защото нямате интернет
                    </p>
                    <a class="back-link" href="/">Върнете се обратно</a>
                </div>
            </main>
        </div>
        <script src="./app.js"></script>
    </body>
</html>
