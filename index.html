<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Календар за намаз 2025</title>
        <link rel="icon" type="image/x-icon" href="/images/favicon.ico" />
        <script>
            (function () {
                var mode = localStorage.getItem('themeMode') || 'system';
                var prefersDark = window.matchMedia(
                    '(prefers-color-scheme: dark)'
                ).matches;
                var resolved =
                    mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
                document.documentElement.setAttribute('data-theme', resolved);

                var colorTheme = localStorage.getItem('colorTheme');
                if (colorTheme && colorTheme !== 'green') {
                    document.documentElement.setAttribute(
                        'data-color-theme',
                        colorTheme
                    );
                }
            })();
        </script>
        <link rel="stylesheet" href="./style.css" />
        <link rel="manifest" href="/manifest.json" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css"
        />
        <script src="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.js"></script>
    </head>

    <body>
        <div class="app-shell">
            <header class="header">
                <button
                    id="settings-button"
                    class="settings-button"
                    type="button"
                    aria-label="Настройки"
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <circle cx="12" cy="12" r="3" />
                        <path
                            d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.04 1.56V21a2 2 0 0 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.04H3a2 2 0 0 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1.04-1.56V3a2 2 0 0 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.56 1.04H21a2 2 0 0 1 0 4h-.09a1.7 1.7 0 0 0-1.56 1.04Z"
                        />
                    </svg>
                </button>
                <h1 class="app-title">Времето за намаз</h1>
                <div class="city-select-wrapper">
                    <select name="city" id="selected-city" class="city-select">
                        <option value="aytos">Айтос</option>
                        <option value="balchik">Балчик</option>
                        <option value="blagoevgrad">Благоевград</option>
                        <option value="burgas">Бургас</option>
                        <option value="byala">Бяла</option>
                        <option value="varna">Варна</option>
                        <option value="velikipreslav">Велики Преслав</option>
                        <option value="velikotarnovo">Велико Търново</option>
                        <option value="velingrad">Велинград</option>
                        <option value="gornaoryahovitsa">Горна Оряховица</option>
                        <option value="gotzedelchev">Гоце Делчев</option>
                        <option value="dobrich">Добрич</option>
                        <option value="isperih">Исперих</option>
                        <option value="kavarna">Каварна</option>
                        <option value="kaolinovo">Каолиново</option>
                        <option value="karlovo">Карлово</option>
                        <option value="karnobat">Карнобат</option>
                        <option value="kneja">Кнежа</option>
                        <option value="kotel">Котел</option>
                        <option value="krumovgrad">Крумовград</option>
                        <option value="kubrat">Кубрат</option>
                        <option value="kardjali">Кърджали</option>
                        <option value="lovech">Ловеч</option>
                        <option value="madan">Мадан</option>
                        <option value="montana">Монтана</option>
                        <option value="nikipol">Никопол</option>
                        <option value="novazagora">Нова Загора</option>
                        <option value="novipazar">Нови пазар</option>
                        <option value="pazardzhik">Пазарджик</option>
                        <option value="pleven">Плевен</option>
                        <option value="plovdiv">Пловдив</option>
                        <option value="provadiya">Провадия</option>
                        <option value="razgrad">Разград</option>
                        <option value="ruse">Русе</option>
                        <option value="svistov">Свищов</option>
                        <option value="silistra">Силистра</option>
                        <option value="sitovo">Ситово</option>
                        <option value="sliven">Сливен</option>
                        <option value="smolyan">Смолян</option>
                        <option value="sofia" selected="selected">София</option>
                        <option value="starazagora">Стара Загора</option>
                        <option value="tvarditza">Твърдица</option>
                        <option value="targoviste">Търговище</option>
                        <option value="harmanli">Харманли</option>
                        <option value="haskovo">Хасково</option>
                        <option value="shumen">Шумен</option>
                        <option value="yakoruda">Якоруда</option>
                        <option value="yambol">Ямбол</option>
                    </select>
                </div>
                <button
                    id="install-button"
                    class="install-button"
                    type="button"
                    hidden
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <path d="M12 3v12M7 10l5 5 5-5" />
                        <path d="M4 18v2a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-2" />
                    </svg>
                    Инсталирай
                </button>
            </header>
            <div id="ios-install-instructions" class="modal" hidden>
                <div class="modal__card">
                    <button
                        class="modal__close"
                        type="button"
                        aria-label="Затвори"
                    >
                        &times;
                    </button>
                    <h3>Инсталиране на iPhone</h3>
                    <ol>
                        <li>
                            Натиснете бутона
                            <strong>Споделяне</strong>
                            <svg
                                class="share-icon"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                aria-hidden="true"
                            >
                                <path d="M12 16V4M8 8l4-4 4 4" />
                                <path
                                    d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"
                                />
                            </svg>
                            в лентата на Safari.
                        </li>
                        <li>
                            Превъртете надолу и изберете
                            <strong>„Добави към начален екран“</strong>.
                        </li>
                        <li>
                            Натиснете
                            <strong>„Добави“</strong>
                            горе вдясно.
                        </li>
                    </ol>
                </div>
            </div>
            <div id="settings-modal" class="modal" hidden>
                <div class="modal__card">
                    <button
                        class="modal__close"
                        type="button"
                        aria-label="Затвори"
                    >
                        &times;
                    </button>
                    <h3>Настройки</h3>

                    <p class="settings-section-label">Тема</p>
                    <div class="theme-toggle" role="group" aria-label="Тема">
                        <button
                            type="button"
                            class="theme-toggle__option"
                            data-theme-mode="light"
                        >
                            Светла
                        </button>
                        <button
                            type="button"
                            class="theme-toggle__option"
                            data-theme-mode="dark"
                        >
                            Тъмна
                        </button>
                        <button
                            type="button"
                            class="theme-toggle__option"
                            data-theme-mode="system"
                        >
                            Системна
                        </button>
                    </div>

                    <p class="settings-section-label">Цвят</p>
                    <div
                        class="color-swatches"
                        role="group"
                        aria-label="Цветова тема"
                    >
                        <button
                            type="button"
                            class="color-swatch"
                            data-color-theme-option="green"
                            style="--swatch-color: #2e8b57"
                            aria-label="Зелен"
                        ></button>
                        <button
                            type="button"
                            class="color-swatch"
                            data-color-theme-option="blue"
                            style="--swatch-color: #2563eb"
                            aria-label="Син"
                        ></button>
                        <button
                            type="button"
                            class="color-swatch"
                            data-color-theme-option="teal"
                            style="--swatch-color: #0d9488"
                            aria-label="Тюркоазен"
                        ></button>
                        <button
                            type="button"
                            class="color-swatch"
                            data-color-theme-option="purple"
                            style="--swatch-color: #7c3aed"
                            aria-label="Лилав"
                        ></button>
                        <button
                            type="button"
                            class="color-swatch"
                            data-color-theme-option="amber"
                            style="--swatch-color: #d97706"
                            aria-label="Кехлибарен"
                        ></button>
                    </div>
                </div>
            </div>
            <main id="content">
                <div id="swiper" class="swiper">
                    <!-- Additional required wrapper -->
                    <div class="swiper-wrapper">
                        <!-- Slides -->
                    </div>
                    <!-- If we need scrollbar -->
                    <div class="swiper-scrollbar"></div>
                </div>
                <button
                    id="today-button"
                    class="today-button"
                    type="button"
                    hidden
                >
                    <svg
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        aria-hidden="true"
                    >
                        <rect x="3" y="4" width="18" height="18" rx="3" />
                        <path d="M16 2v4M8 2v4M3 10h18" />
                    </svg>
                    Днес
                </button>
            </main>
        </div>
        <script src="./app.js"></script>
    </body>
</html>
